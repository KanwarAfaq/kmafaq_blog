name: KM Afaq Agent Tests

on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - run: python -m unittest discover -s agent/tests -v
