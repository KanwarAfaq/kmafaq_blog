name: KM Afaq AI Agent - 5 Urdu + 5 English Daily

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task
        required: true
        default: publish
        type: choice
        options: [publish, summary]
      language:
        description: Article language (publish only)
        required: true
        default: ur
        type: choice
        options: [ur, en]
  schedule:
    # Pakistan Standard Time = UTC+5
    # Urdu: 08:00, 11:00, 14:00, 18:00, 22:00
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    # English: 09:30, 12:30, 16:00, 20:00, 23:30
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '30 18 * * *'
    # Safety summary check: 23:50 PKT. It sends nothing unless 5/5 + 5/5 is complete.
    - cron: '50 18 * * *'

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt

      - name: Decide task/language
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
          MANUAL_LANGUAGE: ${{ inputs.language }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "task=$MANUAL_TASK" >> "$GITHUB_OUTPUT"
            echo "language=$MANUAL_LANGUAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_SCHEDULE" = "50 18 * * *" ]; then
            echo "task=summary" >> "$GITHUB_OUTPUT"
            echo "language=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "task=publish" >> "$GITHUB_OUTPUT"
          case "$EVENT_SCHEDULE" in
            '0 3 * * *'|'0 6 * * *'|'0 9 * * *'|'0 13 * * *'|'0 17 * * *') echo "language=ur" >> "$GITHUB_OUTPUT" ;;
            *) echo "language=en" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run agent
        env:
          SITE_URL: https://kmafaq.online
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGENT_AUTHOR_ID: ${{ secrets.AGENT_AUTHOR_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DAILY_POST_LIMIT_PER_LANGUAGE: '5'
          PUBLISH_TIMEZONE: Asia/Karachi
          DUPLICATE_WINDOW_DAYS: '3'
          ALLOW_PUBLISH_WITHOUT_IMAGE: 'false'
          LINE_DAILY_SUMMARY_REQUIRED: 'true'
        shell: bash
        run: |
          if [ "${{ steps.plan.outputs.task }}" = "summary" ]; then
            python -m agent.main daily-summary
          else
            python -m agent.main run --language "${{ steps.plan.outputs.language }}"
          fi
