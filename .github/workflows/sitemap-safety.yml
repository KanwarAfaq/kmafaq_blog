name: Sitemap safety
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'api/sitemap.js'
      - 'package.json'
      - 'scripts/remove-static-sitemap.mjs'
      - 'tests/sitemap-routing.test.mjs'
      - 'scripts/generate-seo.mjs'
      - 'scripts/prerender.mjs'
      - 'tests/seo-pages.test.mjs'
      - 'tests/sitemap.test.mjs'
      - '.github/workflows/sitemap-safety.yml'
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/verify-build.mjs'
      - 'index.html'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SEO generator syntax
        run: |
          node --check scripts/generate-seo.mjs
          node --check scripts/prerender.mjs
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify dynamic sitemap routing
        run: npm run test:build
        env:
          SUPABASE_URL: ''
          SUPABASE_ANON_KEY: ''
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
      - name: Test fail-safe sitemap behavior
        env:
          SUPABASE_URL: ''
          SUPABASE_ANON_KEY: ''
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: node --test tests/sitemap.test.mjs
