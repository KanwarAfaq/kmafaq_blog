name: KM Afaq One-Time Backfill - Oct 2 to Oct 5, 2026

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: km-afaq-oct-2-5-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-oct2-5-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Validate agent and backfill manifest
        run: python -m unittest discover -s agent/tests -v

      - name: Backfill Oct 2-5 website + Facebook posts
        env:
          SITE_URL: https://kmafaq.online
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGENT_AUTHOR_ID: ${{ secrets.AGENT_AUTHOR_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION }}
          FACEBOOK_POSTING_ENABLED: ${{ secrets.FACEBOOK_POSTING_ENABLED }}
          REQUEST_TIMEOUT_SECONDS: '20'
          IMAGE_PROVIDER_ORDER: pexels,pixabay,openverse,gemini
          GEMINI_IMAGE_TIMEOUT_SECONDS: '12'
          PUBLISH_TIMEZONE: Asia/Karachi
          ALLOW_PUBLISH_WITHOUT_IMAGE: 'false'
          PYTHONUNBUFFERED: '1'
        run: python -m agent.backfill_oct_2_5
